_schema-version: '3.1'
ID: plm-translator-capm
version: 1.0.0
description: "PLM Translator on SAP BTP CAP with Google Cloud Translation API and SAP HANA Cloud"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --production
        - npx cds build --production

modules:
  # ─────────────────────────────────────────────────────────────
  # Database Deployer (SAP HANA HDI Container Deployer)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: plm-translator-db

  # ─────────────────────────────────────────────────────────────
  # CAP Node.js Service (Backend Application)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    requires:
      - name: plm-translator-db
      - name: plm-translator-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ─────────────────────────────────────────────────────────────
  # App Deployer / UI5 Frontend
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-app-deployer
    type: com.sap.application.content
    path: app/translator
    requires:
      - name: plm-translator-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: plm-translator-ui5
          artifacts:
            - dist.zip
          target-path: resources/

resources:
  # ─────────────────────────────────────────────────────────────
  # SAP HANA Cloud HDI Container (Managed Database)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ─────────────────────────────────────────────────────────────
  # SAP BTP XSUAA Service (Authentication & Authorization)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: plm-translator-${space}
        tenant-mode: dedicated

  # ─────────────────────────────────────────────────────────────
  # HTML5 Application Repository Host
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
