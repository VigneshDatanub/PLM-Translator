_schema-version: '3.1'
ID: plm-translator-capm
version: 1.0.0
description: "PLM Translator on SAP BTP CAP with Google Cloud Translation API and SAP HANA Cloud"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production

modules:
  # ─────────────────────────────────────────────────────────────
  # Database Deployer (SAP HANA HDI Container Deployer)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: plm-translator-db

  # ─────────────────────────────────────────────────────────────
  # CAP Node.js Service (Backend Application)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    requires:
      - name: plm-translator-db
      - name: plm-translator-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ─────────────────────────────────────────────────────────────
  # UI5 Frontend Archive Builder
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-ui5
    type: html5
    path: app/translator
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms: []

  # ─────────────────────────────────────────────────────────────
  # App Deployer / UI5 Frontend to HTML5 Repository
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: plm-translator-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: plm-translator-ui5
          artifacts:
            - plmtranslatorapp.zip
          target-path: resources/

  # ─────────────────────────────────────────────────────────────
  # Destination Content Module (Subaccount & Instance Destinations for Work Zone)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-destination-content
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: plm-translator-destination-service
        parameters:
          content-target: true
      - name: plm-translator-html5-repo-host
        parameters:
          service-key:
            name: plm-translator-html5-repo-host-key
      - name: plm-translator-auth
        parameters:
          service-key:
            name: plm-translator-auth-key
      - name: srv-api
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: plm_translator_html_repo_host
              ServiceInstanceName: plm-translator-html5-repo-host
              ServiceKeyName: plm-translator-html5-repo-host-key
              sap.cloud.service: plmtranslator
            - Authentication: OAuth2UserTokenExchange
              Name: plm_translator_uaa
              ServiceInstanceName: plm-translator-auth
              ServiceKeyName: plm-translator-auth-key
              sap.cloud.service: plmtranslator
            - Authentication: OAuth2UserTokenExchange
              Name: srv-api
              TokenServiceInstanceName: plm-translator-auth
              TokenServiceKeyName: plm-translator-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: plmtranslator
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: plm_translator_html_repo_host
              ServiceInstanceName: plm-translator-html5-repo-host
              ServiceKeyName: plm-translator-html5-repo-host-key
              sap.cloud.service: plmtranslator
            - Authentication: OAuth2UserTokenExchange
              Name: plm_translator_uaa
              ServiceInstanceName: plm-translator-auth
              ServiceKeyName: plm-translator-auth-key
              sap.cloud.service: plmtranslator
            - Authentication: OAuth2UserTokenExchange
              Name: srv-api
              TokenServiceInstanceName: plm-translator-auth
              TokenServiceKeyName: plm-translator-auth-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: plmtranslator
              HTML5.DynamicDestination: true
              HTML5.ForwardAuthToken: true

resources:
  # ─────────────────────────────────────────────────────────────
  # SAP HANA Cloud HDI Container (Managed Database)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ─────────────────────────────────────────────────────────────
  # SAP BTP XSUAA Service (Authentication & Authorization)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: plm-translator-${space}
        tenant-mode: dedicated

  # ─────────────────────────────────────────────────────────────
  # HTML5 Application Repository Host
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ─────────────────────────────────────────────────────────────
  # Destination Service (For Work Zone Managed Approuter)
  # ─────────────────────────────────────────────────────────────
  - name: plm-translator-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
